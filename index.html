<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu GitHub</title>
    <link rel="stylesheet" href="main.css">
    <script src="main.js" defer></script>
</head>
<body>
    <header>
        <div class="container" id="profile" aria-busy="true">
            <img class="profile-avatar" id="avatar" src="avatar-placeholder.svg" alt="Foto de perfil ainda não carregada" width="180" height="180">
            <h1 class="profile-name" id="name">Carregando perfil…</h1>
            <h2 class="profile-username" id="username">Aguarde os dados do GitHub</h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositórios</h4>
                    <span id="repositories">—</span>
                </li>
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    <span id="followers">—</span>
                </li>
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    <span id="following">—</span>
                </li>
            </ul>
            <a class="profile-link" id="profile-link" hidden>Ver no GitHub</a>
            <p class="profile-status" id="status" role="status" aria-live="polite">Buscando os dados do perfil…</p>
            <button class="profile-link retry-button" id="retry" type="button" hidden>Tentar novamente</button>
            <noscript><p class="profile-status">Ative o JavaScript para carregar os dados do GitHub.</p></noscript>
        </div>
    </header>
</body>
</html>
